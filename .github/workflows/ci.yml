name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend / lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend / lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (currently pass when no tests are found)
        run: npm run test
      - name: Build (generates Prisma client)
        run: npm run build

  collector:
    name: Collector / typecheck, test, coverage and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/collector/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests and coverage thresholds
        run: npm run test:cov
      - name: Build
        run: npm run build

  graph-engine:
    name: Graph Engine / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/graph-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/graph-engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q

  compose:
    name: Docker Compose / validate
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: transcendence_ci
      POSTGRES_PASSWORD: placeholder_for_ci_only
      POSTGRES_DB: transcendence_ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration (do not start containers)
        run: docker compose -f compose.yml config --quiet
