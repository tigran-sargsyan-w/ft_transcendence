name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend / lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend / lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (currently pass when no tests are found)
        run: npm run test
      - name: Build (generates Prisma client)
        run: npm run build

  collector:
    name: Collector / typecheck, test, coverage and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/collector/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests and coverage thresholds
        run: npm run test:cov
      - name: Build
        run: npm run build

  graph-engine:
    name: Graph Engine / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/graph-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/graph-engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build Docker image
        run: docker build -t graph-engine:ci .

  compose:
    name: Docker Compose / validate
    runs-on: ubuntu-latest
    env:
      FT_DEV_TLS_DIR: /tmp/transcendence-ci-tls
      POSTGRES_USER: transcendence_ci
      POSTGRES_DB: transcendence_ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration (do not start containers)
        run: docker compose -f compose.yml config --quiet
      - name: Ensure graph-engine service is present
        run: docker compose -f compose.yml config --services | grep -qx graph-engine

  vault-infrastructure:
    name: Vault infrastructure / static validation
    runs-on: ubuntu-latest
    env:
      FT_DEV_TLS_DIR: /tmp/transcendence-ci-tls
      POSTGRES_USER: transcendence_ci
      POSTGRES_PASSWORD: placeholder_for_ci_only
      POSTGRES_DB: transcendence_ci
    steps:
      - uses: actions/checkout@v4

      - name: Validate infrastructure shell scripts
        run: |
          for script in infra/vault/scripts/*.sh infra/vault/server/*.sh; do
            if head -n 1 "$script" | grep -q 'bash'; then
              bash -n "$script"
            else
              sh -n "$script"
            fi
          done

      - name: Validate PostgreSQL Python syntax
        run: |
          python3 -c 'import ast, pathlib; paths = sorted(pathlib.Path("infra/postgres").glob("*.py")); assert paths, "No PostgreSQL Python files"; [ast.parse(p.read_text(encoding="utf-8"), filename=str(p)) for p in paths]'

      - name: Test AppRole SecretID rotation offline
        run: |
          python3 -m py_compile infra/vault/scripts/rotate-approle.py infra/vault/scripts/test_rotate_approle.py infra/vault/cleanroom/preflight.py
          python3 -m unittest discover -s infra/vault/scripts -p 'test_rotate_approle.py' -v

      - name: Test Vault readiness checks offline
        run: |
          python3 -m py_compile infra/vault/scripts/check-readiness.py infra/vault/scripts/test_check_readiness.py
          python3 -m unittest discover -s infra/vault/scripts -p 'test_check_readiness.py' -v

      - name: Test development Vault unseal helper offline
        run: |
          python3 -m py_compile infra/vault/scripts/dev-unseal.py infra/vault/scripts/dev_unseal_workflow.py
          python3 -m unittest discover -s infra/vault/scripts -p 'test_dev_unseal*.py' -v

      - name: Test unified Compose safety invariants
        run: python3 -m unittest discover -s infra/vault/scripts -p 'test_compose_unification.py' -v

      - name: Test development startup preflight offline
        run: python3 -m unittest discover -s infra/vault/scripts -p 'test_dev_preflight.py' -v

      - name: Validate Vault application Compose
        run: docker compose --profile "*" -f compose.yml config --quiet

      - name: Validate Vault server Compose
        run: docker compose --profile "*" -f infra/vault/server/compose.yml config --quiet
