name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend / lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend / lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Lint
        run: npm run lint
      - name: Unit tests (currently pass when no tests are found)
        run: npm run test
      - name: Build (generates Prisma client)
        run: npm run build

  backend-e2e:
    name: Backend / E2E (HTTP + Socket.IO)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: transcendence_e2e
          POSTGRES_PASSWORD: e2e_test_only
          POSTGRES_DB: transcendence_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transcendence_e2e -d transcendence_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://transcendence_e2e:e2e_test_only@127.0.0.1:5432/transcendence_e2e?schema=public

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Run backend HTTP and Socket.IO E2E tests
        run: npm run test:e2e -- --no-file-parallelism

  collector:
    name: Collector / typecheck, test, coverage and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/collector/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests and coverage thresholds
        run: npm run test:cov
      - name: Build
        run: npm run build

  graph-engine:
    name: Graph Engine / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/graph-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/graph-engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build Docker image
        run: docker build -t graph-engine:ci .

  compose:
    name: Docker Compose / validate
    runs-on: ubuntu-latest
    env:
      FT_DEV_TLS_DIR: /tmp/transcendence-ci-tls
      POSTGRES_USER: transcendence_ci
      POSTGRES_DB: transcendence_ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration (do not start containers)
        run: docker compose -f compose.yml config --quiet
      - name: Ensure graph-engine service is present
        run: docker compose -f compose.yml config --services | grep -qx graph-engine

  vault-infrastructure:
    name: Vault infrastructure / static validation
    runs-on: ubuntu-latest
    env:
      FT_DEV_TLS_DIR: /tmp/transcendence-ci-tls
      POSTGRES_USER: transcendence_ci
      POSTGRES_PASSWORD: placeholder_for_ci_only
      POSTGRES_DB: transcendence_ci
    steps:
      - uses: actions/checkout@v4

      - name: Validate infrastructure shell scripts
        run: |
          for script in infra/vault/scripts/*.sh infra/vault/server/*.sh; do
            if head -n 1 "$script" | grep -q 'bash'; then
              bash -n "$script"
            else
              sh -n "$script"
            fi
          done

      - name: Validate PostgreSQL Python syntax
        run: |
          python3 -c 'import ast, pathlib; paths = sorted(pathlib.Path("infra/postgres").glob("*.py")); assert paths, "No PostgreSQL Python files"; [ast.parse(p.read_text(encoding="utf-8"), filename=str(p)) for p in paths]'

      - name: Test AppRole SecretID rotation offline
        run: |
          python3 -m py_compile infra/vault/scripts/rotate-approle.py infra/vault/scripts/test_rotate_approle.py infra/vault/cleanroom/preflight.py
          python3 -m unittest discover -s infra/vault/scripts -p 'test_rotate_approle.py' -v

      - name: Test Vault readiness checks offline
        run: |
          python3 -m py_compile infra/vault/scripts/check-readiness.py infra/vault/scripts/test_check_readiness.py
          python3 -m unittest discover -s infra/vault/scripts -p 'test_check_readiness.py' -v

      - name: Test development Vault unseal helper offline
        run: |
          python3 -m py_compile infra/vault/scripts/dev-unseal.py infra/vault/scripts/dev_unseal_workflow.py
          python3 -m unittest discover -s infra/vault/scripts -p 'test_dev_unseal*.py' -v

      - name: Test unified Compose safety invariants
        run: python3 -m unittest discover -s infra/vault/scripts -p 'test_compose_unification.py' -v

      - name: Test Clean-Room isolation safety offline
        run: python3 -m unittest discover -s infra/vault/scripts -p 'test_cleanroom_preflight_safety.py' -v

      - name: Test development startup preflight offline
        run: python3 -m unittest discover -s infra/vault/scripts -p 'test_dev_preflight.py' -v

      - name: Test unified startup orchestration and safety offline
        run: python3 -m unittest discover -s infra/vault/scripts -p 'test_dev_start*.py' -v

      - name: Test Prisma migration audit offline
        run: python3 -m unittest discover -s infra/vault/scripts -p 'test_dev_migration_audit.py' -v

      - name: Test PostgreSQL incident ACL regression
        run: bash tests/integration/test_incident_acl.sh

      - name: Validate Vault application Compose
        run: docker compose --profile "*" -f compose.yml config --quiet

      - name: Validate Vault server Compose
        run: docker compose --profile "*" -f infra/vault/server/compose.yml config --quiet

  monitoring:
    name: Monitoring / infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate bootstrap shell syntax
        run: bash -n scripts/bootstrap.sh

      - name: Test development bootstrap and monitoring offline
        run: python3 -m unittest discover -s scripts/dev -p 'test_*.py' -v

      - name: Validate Grafana dashboard JSON
        run: |
          python3 -m json.tool infra/monitoring/grafana/dashboards/demo-lab.json > /dev/null
          python3 -m json.tool infra/monitoring/grafana/dashboards/monitoring-pipeline.json > /dev/null

      - name: Pull the pinned WAF image
        run: docker pull owasp/modsecurity-crs:4.30.0-nginx-202611090911

      - name: Test Grafana datasource requests through isolated WAF
        run: python3 scripts/dev/verify_grafana_datasource.py --isolated

      - name: Pull the pinned Prometheus image
        run: docker pull prom/prometheus:v3.15.0

      - name: Validate Prometheus configuration
        run: |
          docker run --rm --pull never \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --tmpfs /prometheus:rw,nosuid,nodev,noexec,size=16m \
            --mount "type=bind,src=$PWD/infra/monitoring/prometheus,dst=/etc/prometheus,readonly" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.15.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Test Prometheus alerting rules
        run: |
          docker run --rm --pull never \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --tmpfs /prometheus:rw,nosuid,nodev,noexec,size=16m \
            --mount "type=bind,src=$PWD/infra/monitoring/prometheus,dst=/etc/prometheus,readonly" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.15.0 \
            test rules /etc/prometheus/tests/demo-lab.test.yml
