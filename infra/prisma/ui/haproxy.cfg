global
    hard-stop-after 5s

crt-store application
    crt-base /etc/haproxy/certs
    key-base /etc/haproxy/certs
    load crt "cert.pem" key "key.pem"

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s

frontend prisma_https
    bind :5556 ssl crt "@application/cert.pem" ssl-min-ver TLSv1.2

    # Validate the public origin before adapting it to Studio's local HTTP
    # origin. Never turn an arbitrary external origin into a trusted origin.
    acl expected_host req.fhdr(Host) -i "localhost:${DEV_PRISMA_UI_PORT}"
    acl has_origin req.fhdr_cnt(Origin) eq 1
    acl expected_origin req.fhdr(Origin) -m str "https://localhost:${DEV_PRISMA_UI_PORT}"
    acl safe_method method GET HEAD
    # HAProxy integer ACLs support eq, not ne. Negate the exact count.
    http-request deny unless { req.fhdr_cnt(Host) eq 1 }
    http-request deny unless expected_host
    http-request deny if { req.fhdr_cnt(Origin) gt 1 }
    http-request deny if has_origin !expected_origin
    http-request deny if !safe_method !expected_origin
    http-request deny if { req.fhdr(Sec-Fetch-Site) -i cross-site same-site }

    # Cookies are scoped by hostname, not port. Studio does not need app
    # sessions or Vault authentication headers.
    http-request del-header Cookie
    http-request del-header Authorization
    http-request set-header Host localhost:5555
    http-request set-header Origin http://localhost:5555 if expected_origin
    http-request set-header X-Forwarded-Proto https
    http-response del-header Access-Control-Allow-Origin
    http-response del-header Access-Control-Allow-Credentials
    http-response del-header Set-Cookie
    http-response set-header Cache-Control no-store
    http-response set-header X-Frame-Options DENY
    default_backend studio_local

backend studio_local
    server studio 127.0.0.1:5555 check inter 2s rise 1 fall 2
