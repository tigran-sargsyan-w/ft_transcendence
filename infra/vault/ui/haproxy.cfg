global
    maxconn 64
    # Finish soft-stop before the guarded Docker stop timeout (10s).
    hard-stop-after 5s

defaults
    mode tcp
    timeout connect 5s
    timeout client 2m
    timeout server 2m

frontend vault_ui
    bind :8200
    default_backend vault_server

backend vault_server
    server vault vault:8200 check
