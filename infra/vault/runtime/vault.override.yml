# Vault development runtime mounts: use the persistent local TLS identity.
# No initialization, unseal shares or operator credentials are configured here.
services:
  vault:
    volumes:
      - type: bind
        source: ${FT_DEV_TLS_DIR:?}
        target: /vault/tls
        read_only: true
  vault-storage-permissions:
    volumes:
      - type: bind
        source: ${FT_DEV_TLS_DIR:?}
        target: /vault/tls
        read_only: false
  vault-backend-provision:
    volumes:
      - type: bind
        source: ${FT_DEV_TLS_DIR:?}/ca.crt
        target: /vault/tls/ca.crt
        read_only: true
  vault-backend-rotate:
    volumes:
      - type: bind
        source: ${FT_DEV_TLS_DIR:?}/ca.crt
        target: /vault/tls/ca.crt
        read_only: true
  vault-bootstrap:
    volumes:
      - type: bind
        source: ${FT_DEV_TLS_DIR:?}/ca.crt
        target: /vault/tls/ca.crt
        read_only: true
  vault-tls-files:
    volumes:
      - type: bind
        source: ${FT_DEV_TLS_DIR:?}
        target: /vault/tls
        read_only: false
