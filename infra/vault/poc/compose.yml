
name: transcendence-vault-poc

services:
  vault-storage-permissions:
    image: hashicorp/vault:2.2.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /vault/data
        chown vault:vault /vault/data
        chmod 0700 /vault/data
    volumes:
      - vault_data:/vault/data
    network_mode: none
    restart: "no"

  vault:
    image: hashicorp/vault:2.2.1
    command: ["server", "-config=/vault/config/vault.hcl"]

    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt

    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - ./tls:/vault/tls:ro
      - vault_data:/vault/data

    networks:
      - vault_private

    expose:
      - "8200"

    depends_on:
      vault-storage-permissions:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  vault_data:

networks:
  vault_private:
    driver: bridge
    internal: true
