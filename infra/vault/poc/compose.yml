
name: transcendence-vault-poc

services:
  vault-storage-permissions:
    image: hashicorp/vault:2.2.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p \
          /vault/data \
          /vault/auth \
          /vault/rendered \
          /vault/backend-auth \
          /vault/backend-rendered

        chown vault:vault \
          /vault/data \
          /vault/auth \
          /vault/rendered \
          /vault/backend-auth \
          /vault/backend-rendered

        chmod 0700 \
          /vault/data \
          /vault/auth \
          /vault/rendered \
          /vault/backend-auth \
          /vault/backend-rendered

        # Dedicated group for backend secret delivery.
        chown 100:20000 /vault/backend-rendered
        chmod 0750 /vault/backend-rendered

    volumes:
      - vault_data:/vault/data
      - vault_agent_auth:/vault/auth
      - vault_rendered:/vault/rendered
      - backend_agent_auth:/vault/backend-auth
      - backend_rendered:/vault/backend-rendered

    network_mode: none
    restart: "no"

  vault:
    image: hashicorp/vault:2.2.1
    command: ["server"]

    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt

    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - ./tls:/vault/tls:ro
      - vault_data:/vault/data

    networks:
      - vault_private

    expose:
      - "8200"

    depends_on:
      vault-storage-permissions:
        condition: service_completed_successfully

    restart: unless-stopped

  vault-agent:
    image: hashicorp/vault:2.2.1
    user: "100:1000"

    command:
      - vault
      - agent
      - -config=/vault/config/agent.hcl

    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt

    volumes:
      - ./agent.hcl:/vault/config/agent.hcl:ro
      - ./tls/ca.crt:/vault/tls/ca.crt:ro
      - vault_agent_auth:/vault/auth:ro
      - vault_rendered:/vault/rendered

    networks:
      - vault_private

    depends_on:
      vault:
        condition: service_started
      vault-storage-permissions:
        condition: service_completed_successfully

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

  vault-approle-provision:
    image: hashicorp/vault:2.2.1
    profiles:
      - setup

    user: "100:1000"
    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        umask 077

        # Authenticate with Root Token
        printf "Vault root token (hidden): "
        IFS= read -r -s VAULT_TOKEN
        printf "\n"
        export VAULT_TOKEN

        if ! vault token lookup >/dev/null 2>&1; then
          echo "Vault authentication failed"
          exit 1
        fi

        # Clean up temporary files on exit
        trap 'rm -f /vault/auth/.role_id.next /vault/auth/.secret_id.next' EXIT

        # Generate new AppRole credentials
        vault read -field=role_id \
          auth/approle/role/poc-reader/role-id \
          > /vault/auth/.role_id.next

        vault write -force -field=secret_id \
          auth/approle/role/poc-reader/secret-id \
          > /vault/auth/.secret_id.next

        # Validate generated credentials
        test -s /vault/auth/.role_id.next
        test -s /vault/auth/.secret_id.next

        # Restrict file permissions
        chmod 0400 \
          /vault/auth/.role_id.next \
          /vault/auth/.secret_id.next

        # Replace existing credentials
        mv -f /vault/auth/.role_id.next /vault/auth/role_id
        mv -f /vault/auth/.secret_id.next /vault/auth/secret_id

        # Clear administrative token
        unset VAULT_TOKEN

        echo "AppRole credentials provisioned successfully"

    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt

    volumes:
      - ./tls/ca.crt:/vault/tls/ca.crt:ro
      - vault_agent_auth:/vault/auth

    networks:
      - vault_private

    restart: "no"

  vault-backend-agent:
    image: hashicorp/vault:2.2.1

    profiles:
      - backend-integration

    user: "100:20000"

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        umask 077

        mkdir -p /vault/runtime/agent
        chmod 0700 /vault/runtime/agent

        rm -f /vault/runtime/agent/token
        rm -f /vault/rendered/database_url

        exec vault agent -config=/vault/config/backend.hcl

    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt

    volumes:
      - ../agent/backend.hcl:/vault/config/backend.hcl:ro
      - ./tls/ca.crt:/vault/tls/ca.crt:ro
      - backend_agent_auth:/vault/auth:ro
      - backend_rendered:/vault/rendered

    tmpfs:
      - /vault/runtime:mode=1777

    networks:
      - vault_private

    depends_on:
      vault:
        condition: service_started
      vault-storage-permissions:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD-SHELL
        - >
          test -s /vault/rendered/database_url &&
          test -r /vault/rendered/database_url &&
          test -s /vault/runtime/agent/token &&
          expected="$$(VAULT_TOKEN="$$(cat /vault/runtime/agent/token)" vault kv get -field=database_url -mount=kv ft-transcendence/dev/backend 2>/dev/null)" &&
          actual="$$(cat /vault/rendered/database_url)" &&
          test "$$actual" = "$$expected"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

  vault-backend-provision:
    image: hashicorp/vault:2.2.1

    profiles:
      - setup

    user: "100:1000"
    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        umask 077

        # Authenticate with the POC administrative token.
        printf "Vault root token (hidden): "
        IFS= read -r -s VAULT_TOKEN
        printf "\n"
        export VAULT_TOKEN

        if ! vault token lookup >/dev/null 2>&1; then
          echo "Vault authentication failed"
          exit 1
        fi

        # Remove temporary files if provisioning fails.
        trap 'rm -f /vault/auth/.role_id.next /vault/auth/.secret_id.next' EXIT

        # Retrieve Backend AppRole credentials.
        vault read -field=role_id \
          auth/approle/role/backend-reader/role-id \
          > /vault/auth/.role_id.next

        vault write -force -field=secret_id \
          auth/approle/role/backend-reader/secret-id \
          > /vault/auth/.secret_id.next

        # Validate the generated files.
        test -s /vault/auth/.role_id.next
        test -s /vault/auth/.secret_id.next

        # Apply restrictive permissions.
        chmod 0400 \
          /vault/auth/.role_id.next \
          /vault/auth/.secret_id.next

        # Replace credentials.
        mv -f /vault/auth/.role_id.next /vault/auth/role_id
        mv -f /vault/auth/.secret_id.next /vault/auth/secret_id

        unset VAULT_TOKEN

        echo "Backend AppRole credentials provisioned successfully"

    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt

    volumes:
      - ./tls/ca.crt:/vault/tls/ca.crt:ro
      - backend_agent_auth:/vault/auth

    networks:
      - vault_private

    restart: "no"

volumes:
  vault_data:
  vault_agent_auth:
  vault_rendered:
  backend_agent_auth:
  backend_rendered:

networks:
  vault_private:
    driver: bridge
    internal: true
