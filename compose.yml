services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      VOLUMES: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
    ports: # TODO: Remove on production
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  collector:
    build:
      context: ./services/collector
    environment:
      PORT: 3001
      DOCKER_API_URL: http://docker-proxy:2375
      ENVIRONMENT_ID: env_local_compose
    depends_on:
      - docker-proxy
    ports: # TODO: Remove on production
      - "127.0.0.1:3001:3001"

  graph-engine:
    build:
      context: ./services/graph-engine
    ports: # TODO: Remove on production
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      GRAPH_ENGINE_URL: http://graph-engine:8000
    ports: # Loopback only: the login limit trusts X-Forwarded-For (app.setup.ts)
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    build:
      context: ./infra/docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped


volumes:
  postgres_data:
