name: transcendence-app-dev

# Vault-only runtime. The future trusted startup supplies FT_DEV_TLS_DIR.
# PostgreSQL bootstrap is separate; existing data volumes must be verified before up.
services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      VOLUMES: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  collector:
    build:
      context: ./services/collector
    environment:
      PORT: 3001
      DOCKER_API_URL: http://docker-proxy:2375
      ENVIRONMENT_ID: env_local_compose
    depends_on:
      - docker-proxy

  graph-engine:
    build:
      context: ./services/graph-engine
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    user: "10001:20000"

    environment:
      GRAPH_ENGINE_URL: http://graph-engine:8000
      COLLECTOR_URL: http://collector:3001
      APP_ORIGIN: ${APP_ORIGIN:-https://transcendence.test:8443}
      DATABASE_URL_FILE: /run/secrets/backend/database_url

    volumes:
      - ./backend/prisma:/app/prisma:ro
      - backend_vault_rendered:/run/secrets/backend:ro

    depends_on:
      postgres:
        condition: service_healthy
      vault-backend-agent:
        condition: service_healthy

    command:
      - sh
      - -ec
      - |
        sh scripts/wait-for-database-secret.sh
        exec npm run start:prod

    # Runtime container hardening
    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    # Prevent modifications to the container root filesystem.
    read_only: true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          (async () => {
            const response = await fetch(
              "http://127.0.0.1:3000/api/v1/health",
              { signal: AbortSignal.timeout(3000) }
            );

            if (!response.ok) {
              throw new Error(`HTTP $${response.status}`);
            }

            const body = await response.json();

            if (
              body?.data?.status !== "ok" ||
              body?.data?.database !== "ok"
            ) {
              throw new Error("Backend or database is unhealthy");
            }
          })().catch((error) => {
            console.error(`Healthcheck failed: $${error.message}`);
            process.exitCode = 1;
          });

      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/src

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src

  postgres:
    build:
      context: ./infra/docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  vault-backend-agent:
    image: hashicorp/vault:2.2.1
    user: "100:20000"

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        umask 077

        mkdir -p /vault/runtime/agent
        chmod 0700 /vault/runtime/agent

        rm -f /vault/runtime/agent/token
        rm -f /vault/rendered/database_url

        exec vault agent -config=/vault/config/backend.hcl

    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt

    volumes:
      - ./infra/vault/agent/backend.hcl:/vault/config/backend.hcl:ro
      - ${FT_DEV_TLS_DIR:?Set FT_DEV_TLS_DIR}/ca.crt:/vault/tls/ca.crt:ro
      - backend_vault_auth:/vault/auth:ro
      - backend_vault_rendered:/vault/rendered

    tmpfs:
      - /vault/runtime:mode=1777

    networks:
      - vault_private

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - >
          test -s /vault/rendered/database_url &&
          test -r /vault/rendered/database_url &&
          test -s /vault/runtime/agent/token &&
          expected="$$(VAULT_TOKEN="$$(cat /vault/runtime/agent/token)" vault kv get -field=database_url -mount=kv ft-transcendence/dev/backend 2>/dev/null)" &&
          actual="$$(cat /vault/rendered/database_url)" &&
          test "$$actual" = "$$expected"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

  vault-postgres-provisioner-storage-init:
    image: hashicorp/vault:2.2.1
    user: "0:0"

    profiles:
      - vault-setup

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        mkdir -p /vault/auth /vault/rendered

        # AppRole credentials: accessible only to UID 100.
        chown 100:1000 /vault/auth
        chmod 0700 /vault/auth

        # Rendered credentials: dedicated provisioning group.
        chown 100:20020 /vault/rendered
        chmod 0750 /vault/rendered

    volumes:
      - postgres_provisioner_vault_auth:/vault/auth
      - postgres_provisioner_rendered:/vault/rendered

    network_mode: none
    restart: "no"

  vault-postgres-provisioner-provision:
    image: hashicorp/vault:2.2.1
    user: "100:1000"

    profiles:
      - vault-setup

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        set -eu
        umask 077

        printf "Vault admin token (hidden): "
        IFS= read -r -s VAULT_TOKEN
        printf "\\n"
        export VAULT_TOKEN

        vault token lookup >/dev/null

        trap 'rm -f /vault/auth/.role_id.next /vault/auth/.secret_id.next' EXIT

        vault read -field=role_id \
          auth/approle/role/postgres-provisioner-reader/role-id \
          > /vault/auth/.role_id.next

        vault write -force -field=secret_id \
          auth/approle/role/postgres-provisioner-reader/secret-id \
          > /vault/auth/.secret_id.next

        test -s /vault/auth/.role_id.next
        test -s /vault/auth/.secret_id.next

        chmod 0400 \
          /vault/auth/.role_id.next \
          /vault/auth/.secret_id.next

        mv -f /vault/auth/.role_id.next /vault/auth/role_id
        mv -f /vault/auth/.secret_id.next /vault/auth/secret_id

        unset VAULT_TOKEN

        echo "PostgreSQL Provisioner AppRole credentials provisioned successfully"

    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt

    volumes:
      - ${FT_DEV_TLS_DIR:?Set FT_DEV_TLS_DIR}/ca.crt:/vault/tls/ca.crt:ro
      - postgres_provisioner_vault_auth:/vault/auth

    networks:
      - vault_private

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: "no"

  vault-postgres-provisioner-agent:
    image: hashicorp/vault:2.2.1
    user: "100:20020"

    profiles:
      - vault-setup

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        set -eu
        umask 077

        # Remove stale credentials before each provisioning attempt.
        rm -f /vault/rendered/backend_database_url
        rm -f /vault/rendered/migrator_database_url

        cleanup_on_failure() {
          status=$?
          if [ "$$status" -ne 0 ]; then
            rm -f /vault/rendered/backend_database_url
            rm -f /vault/rendered/migrator_database_url
          fi
        }

        trap cleanup_on_failure EXIT

        vault agent -config=/vault/config/postgres-provisioner.hcl

        test -s /vault/rendered/backend_database_url
        test -s /vault/rendered/migrator_database_url

        echo "PostgreSQL provisioning credentials rendered successfully"

    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt

    volumes:
      - ./infra/vault/agent/postgres-provisioner.hcl:/vault/config/postgres-provisioner.hcl:ro
      - ${FT_DEV_TLS_DIR:?Set FT_DEV_TLS_DIR}/ca.crt:/vault/tls/ca.crt:ro
      - postgres_provisioner_vault_auth:/vault/auth:ro
      - postgres_provisioner_rendered:/vault/rendered

    networks:
      - vault_private

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: "no"

  vault-postgres-provisioner-reader:
    image: hashicorp/vault:2.2.1
    user: "100:20020"

    profiles:
      - vault-maintenance

    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "exec sleep 600"

    volumes:
      - postgres_provisioner_rendered:/vault/rendered:ro

    network_mode: none
    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: "no"

  vault-postgres-provisioner-cleanup:
    image: hashicorp/vault:2.2.1
    user: "100:20020"

    profiles:
      - vault-maintenance

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        set -eu

        rm -f /vault/rendered/backend_database_url
        rm -f /vault/rendered/migrator_database_url

        test ! -e /vault/rendered/backend_database_url
        test ! -e /vault/rendered/migrator_database_url

        echo "PostgreSQL provisioning credentials cleaned up successfully"

    volumes:
      - postgres_provisioner_rendered:/vault/rendered

    network_mode: none

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: "no"

  vault-migrator-rotate:
    image: python:3.12-alpine
    profiles: [vault-maintenance]
    user: "100:1000"
    entrypoint: ["python3", "/vault/scripts/rotate-approle.py", "migrator-reader", "/vault/auth"]
    command: ["rotate"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./infra/vault/scripts/rotate-approle.py:/vault/scripts/rotate-approle.py:ro
      - ${FT_DEV_TLS_DIR:?Set FT_DEV_TLS_DIR}/ca.crt:/vault/tls/ca.crt:ro
      - migrator_vault_auth:/vault/auth
    networks:
      - vault_private
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  vault-postgres-provisioner-rotate:
    image: python:3.12-alpine
    profiles: [vault-maintenance]
    user: "100:1000"
    entrypoint: ["python3", "/vault/scripts/rotate-approle.py", "postgres-provisioner-reader", "/vault/auth"]
    command: ["rotate"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./infra/vault/scripts/rotate-approle.py:/vault/scripts/rotate-approle.py:ro
      - ${FT_DEV_TLS_DIR:?Set FT_DEV_TLS_DIR}/ca.crt:/vault/tls/ca.crt:ro
      - postgres_provisioner_vault_auth:/vault/auth
    networks:
      - vault_private
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  vault-migrator-storage-init:
    image: hashicorp/vault:2.2.1
    user: "0:0"

    profiles:
      - vault-setup

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        mkdir -p /vault/auth /vault/rendered

        # AppRole credentials: accessible only to UID 100.
        chown 100:1000 /vault/auth
        chmod 0700 /vault/auth

        # Rendered secret: shared group for Prisma Migrate.
        chown 100:20010 /vault/rendered
        chmod 0750 /vault/rendered

    volumes:
      - migrator_vault_auth:/vault/auth
      - migrator_vault_rendered:/vault/rendered

    network_mode: none
    restart: "no"

  vault-migrator-provision:
    image: hashicorp/vault:2.2.1
    user: "100:1000"

    # Provisioning must only run explicitly.
    profiles:
      - vault-setup

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        umask 077

        printf "Vault admin token: "
        IFS= read -r -s VAULT_TOKEN
        printf "\n"
        export VAULT_TOKEN

        # Verify administrative access.
        vault token lookup >/dev/null

        # Retrieve credentials for the migration AppRole.
        role_id="$$(vault read -field=role_id \
          auth/approle/role/migrator-reader/role-id)"

        secret_id="$$(vault write -force -field=secret_id \
          auth/approle/role/migrator-reader/secret-id)"

        test -n "$$role_id"
        test -n "$$secret_id"

        # Clean up temporary files on exit.
        trap 'rm -f /vault/auth/role_id.tmp /vault/auth/secret_id.tmp' EXIT

        # Write credentials with restrictive permissions.
        printf '%s' "$$role_id" > /vault/auth/role_id.tmp
        printf '%s' "$$secret_id" > /vault/auth/secret_id.tmp

        chmod 0400 /vault/auth/role_id.tmp
        chmod 0400 /vault/auth/secret_id.tmp

        mv -f /vault/auth/role_id.tmp /vault/auth/role_id
        mv -f /vault/auth/secret_id.tmp /vault/auth/secret_id

        unset role_id secret_id VAULT_TOKEN

        echo "Migration AppRole credentials provisioned successfully"

    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt

    volumes:
      - ${FT_DEV_TLS_DIR:?Set FT_DEV_TLS_DIR}/ca.crt:/vault/tls/ca.crt:ro
      - migrator_vault_auth:/vault/auth

    networks:
      - vault_private

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: "no"

  vault-migrator-agent:
    image: hashicorp/vault:2.2.1
    profiles:
      - vault-migration
    user: "100:20010"

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        umask 077

        # Remove the previous secret before each execution.
        rm -f /vault/rendered/database_url

        # Authenticate, render the migration secret, then exit.
        exec vault agent -config=/vault/config/migrator.hcl

    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt

    volumes:
      - ./infra/vault/agent/migrator.hcl:/vault/config/migrator.hcl:ro
      - ${FT_DEV_TLS_DIR:?Set FT_DEV_TLS_DIR}/ca.crt:/vault/tls/ca.crt:ro
      - migrator_vault_auth:/vault/auth:ro
      - migrator_vault_rendered:/vault/rendered

    networks:
      - vault_private

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: "no"

  backend-migrate:
    build:
      context: ./backend

    profiles:
      - vault-migration

    user: "10011:20010"

    environment:
      DATABASE_URL_FILE: /run/secrets/migrator/database_url

    volumes:
      - migrator_vault_rendered:/run/secrets/migrator:ro

    depends_on:
      postgres:
        condition: service_healthy
      vault-migrator-agent:
        condition: service_completed_successfully

    command:
      - sh
      - -ec
      - |
        sh scripts/wait-for-database-secret.sh
        exec ./node_modules/.bin/prisma migrate deploy

    restart: "no"

  vault-migrator-cleanup:
    image: hashicorp/vault:2.2.1
    user: "100:20010"

    # Never run as part of the normal application startup.
    profiles:
      - vault-maintenance

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        rm -f /vault/rendered/database_url

        test ! -e /vault/rendered/database_url

        echo "Migration secret cleaned up successfully"

    volumes:
      - migrator_vault_rendered:/vault/rendered

    network_mode: none

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: "no"

volumes:
  postgres_data:
  migrator_vault_auth:
  migrator_vault_rendered:
  postgres_provisioner_vault_auth:
  postgres_provisioner_rendered:
  backend_vault_rendered:
    external: true
    name: transcendence-vault-dev_backend_rendered
  backend_vault_auth:
    external: true
    name: transcendence-vault-dev_backend_agent_auth

networks:
  vault_private:
    external: true
    name: transcendence-vault-dev_vault_private
